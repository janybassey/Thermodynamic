<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>House Thermodynamics Simulation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#e0e6f0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#111827;border-bottom:1px solid #1f2d45;flex-shrink:0;flex-wrap:wrap;gap:4px}
#topbar h1{font-size:13px;font-weight:600;color:#60a5fa;letter-spacing:.5px;white-space:nowrap}
#stats{display:flex;gap:10px;font-size:11px;color:#94a3b8}
.stat{display:flex;align-items:center;gap:4px}
.stat-val{color:#f0f9ff;font-weight:600}
#canvas-wrap{flex:1;position:relative;overflow:hidden}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#controls{background:#111827;border-top:1px solid #1f2d45;padding:6px 8px;flex-shrink:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center}
.ctrl-group{display:flex;gap:4px;align-items:center}
.ctrl-label{font-size:10px;color:#64748b;white-space:nowrap;padding-right:2px}
button{border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:30px}
.btn-toggle{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.btn-toggle.active{background:#1d4ed8;color:#fff;border-color:#3b82f6;box-shadow:0 0 8px rgba(59,130,246,.4)}
.btn-toggle.active-warm{background:#b45309;color:#fff;border-color:#f59e0b;box-shadow:0 0 8px rgba(245,158,11,.4)}
.btn-toggle.active-open{background:#065f46;color:#fff;border-color:#10b981;box-shadow:0 0 8px rgba(16,185,129,.3)}
#legend{position:absolute;bottom:8px;left:8px;background:rgba(10,14,26,.8);border:1px solid #1f2d45;border-radius:6px;padding:6px 8px;font-size:10px;pointer-events:none}
.legend-row{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.legend-swatch{width:12px;height:8px;border-radius:2px}
#fps-counter{position:absolute;top:4px;right:6px;font-size:10px;color:#475569;pointer-events:none}
@media(max-width:600px){
  button{padding:4px 7px;font-size:10px;min-height:26px}
  #topbar h1{font-size:11px}
  .ctrl-label{font-size:9px}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>&#x1f321; House Thermodynamics</h1>
    <div id="stats">
      <div class="stat">Avg T: <span class="stat-val" id="s-avg">--</span>&deg;C</div>
      <div class="stat">Min: <span class="stat-val" id="s-min">--</span>&deg;C</div>
      <div class="stat">Max: <span class="stat-val" id="s-max">--</span>&deg;C</div>
      <div class="stat">N: <span class="stat-val" id="s-n">0</span></div>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="sim"></canvas>
    <div id="legend">
      <div class="legend-row"><div class="legend-swatch" style="background:#4488ff"></div>Cold (0&deg;C)</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#22c55e"></div>Mild (18&deg;C)</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#f97316"></div>Warm (25&deg;C)</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#ef4444"></div>Hot (40&deg;C)</div>
    </div>
    <div id="fps-counter">60 FPS</div>
  </div>
  <div id="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">HEAT</span>
      <button class="btn-toggle active active-warm" id="btn-heat" onclick="toggle('heat')">Radiators ON</button>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">SEASON</span>
      <button class="btn-toggle" id="btn-season" onclick="toggle('season')">Winter</button>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">OPENINGS</span>
      <button class="btn-toggle" id="btn-cave" onclick="toggle('cave')">Cave Door</button>
      <button class="btn-toggle" id="btn-veranda" onclick="toggle('veranda')">Veranda Bay</button>
      <button class="btn-toggle" id="btn-velux" onclick="toggle('velux')">Velux R+2</button>
      <button class="btn-toggle" id="btn-facade" onclick="toggle('facade')">Facade Windows</button>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">SIM</span>
      <button class="btn-toggle" id="btn-speed" onclick="toggle('speed')">1x Speed</button>
    </div>
  </div>
</div>

<script>
'use strict';

const state = {
  heat: true,
  summer: false,
  cave: false,
  veranda: false,
  velux: false,
  facade: false,
  speed: false
};

const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d', {alpha:false});

let W = 0, H = 0, scale = 1;
const SIM_W = 1000, SIM_H = 700;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  W = canvas.width;
  H = canvas.height;
  scale = Math.min(W / SIM_W, H / SIM_H);
  ctx.scale(dpr, dpr);
  buildGeometry();
}
window.addEventListener('resize', resize);

const G = {
  basY1: 490, basY2: 700,
  rdcY1: 280, rdcY2: 490,
  r1Y1:  100, r1Y2:  280,
  r2Y1:    0, r2Y2:  100,
  houseX1: 0, houseX2: 700,
  verX1: 700, verX2: 1000,
  verY1: 285, verY2: 460,
  verRoofLeft: 0,
  verRoofRight: 0,
};

let walls = [];
let rooms = [];
let radiators = [];
let openings = [];
let heatZones = [];

const GRID_COLS = 50, GRID_ROWS = 35;
let gridW, gridH;
let wallGrid = [];

function buildGeometry() {
  walls = [];
  rooms = [];
  radiators = [];
  openings = [];
  heatZones = [];

  addWall(0, G.rdcY1, 0, G.rdcY2, 'wall');
  addWall(G.houseX2, G.rdcY1, G.houseX2, G.rdcY2, 'wall');
  addWall(0, G.rdcY2, G.houseX2, G.rdcY2, 'wall');
  addWall(0, G.rdcY1, G.houseX2, G.rdcY1, 'wall');

  addWall(0, G.basY1, 0, G.basY2, 'wall');
  addWall(G.houseX2, G.basY1, G.houseX2, G.basY2, 'wall');
  addWall(0, G.basY2, G.houseX2, G.basY2, 'ground');

  addWall(0, G.r1Y1, 0, G.r1Y2, 'wall');
  addWall(G.houseX2, G.r1Y1, G.houseX2, G.r1Y2, 'wall');
  addWall(0, G.r1Y2, G.houseX2, G.r1Y2, 'wall');
  addWall(0, G.r1Y1, G.houseX2, G.r1Y1, 'wall');

  addWall(0, G.r1Y1, 180, G.r2Y1, 'wall');
  addWall(180, G.r2Y1, 520, G.r2Y1, 'wall');
  addWall(520, G.r2Y1, G.houseX2, G.r1Y1, 'wall');

  addWall(G.verX1, G.verY1, G.verX2, G.verY1+65, 'glass');
  addWall(G.verX2, G.verY1+65, G.verX2, G.verY2, 'glass');
  addWall(G.verX1, G.verY2, G.verX2, G.verY2, 'wall');
  addWall(G.verX1, G.verY1, G.verX1, G.verY2, 'wall');

  addWallSegmented(0, G.rdcY2, G.houseX2, G.rdcY2, 'wall', 0, [[400,480]]);
  addWallSegmented(0, G.rdcY1, G.houseX2, G.rdcY1, 'wall', 0, [[350,430]]);
  addWallSegmented(0, G.r1Y1, G.houseX2, G.r1Y1, 'wall', 0, [[300,380]]);

  addWallSegmented(200, G.rdcY1, 200, G.rdcY2, 'wall', 1, [[G.rdcY1+60, G.rdcY1+120]]);

  addWall(400, G.rdcY1+100, 400, G.rdcY2, 'wall');
  addWall(400, G.rdcY1+20, 400, G.rdcY1+100, 'glass');

  addWall(100, G.rdcY1+80, 200, G.rdcY1+80, 'wall');
  addWall(100, G.rdcY1+80, 100, G.rdcY2, 'wall');

  addWall(G.verX1, G.rdcY1, G.verX1, G.rdcY1+25, 'wall');
  addWall(G.verX1, G.rdcY1+25, G.verX1, G.rdcY1+65, 'glass');
  addWall(G.verX1, G.rdcY1+65, G.verX1, G.rdcY1+75, 'wall');
  addWall(G.verX1, G.rdcY1+75, G.verX1, G.rdcY1+165, 'wall');
  addWall(G.verX1, G.rdcY1+165, G.verX1, G.verY2, 'wall');

  addWallSegmented(230, G.r1Y1, 230, G.r1Y2, 'wall', 1, [[G.r1Y1+50, G.r1Y1+110]]);
  addWallSegmented(480, G.r1Y1, 480, G.r1Y2, 'wall', 1, [[G.r1Y1+50, G.r1Y1+110]]);

  addWallSegmented(200, G.basY1, 200, G.basY2, 'wall', 1, [[G.basY1+30, G.basY1+90]]);
  addWallSegmented(500, G.basY1, 500, G.basY2, 'wall', 1, [[G.basY1+30, G.basY1+90]]);

  addRadiator(30, G.rdcY2-20, 60, 12, 'rdc');
  addRadiator(320, G.rdcY2-20, 60, 12, 'rdc');
  addRadiator(570, G.rdcY2-20, 60, 12, 'rdc');
  addRadiator(G.verX1+10, G.verY2-20, 50, 10, 'veranda');
  addRadiator(30, G.r1Y2-20, 55, 12, 'r1');
  addRadiator(460, G.r1Y1+80, 12, 50, 'r1');
  addRadiator(640, G.r1Y2-20, 55, 12, 'r1');
  addRadiator(100, G.r2Y1+20, 55, 12, 'r2');
  addRadiator(560, G.r2Y1+20, 55, 12, 'r2');

  heatZones.push({x1:0, y1:G.basY2-20, x2:G.houseX2, y2:G.basY2, temp:0.22, cond:0.008, type:'ground'});

  addGlassZone(0, G.rdcY1+20, 8, G.rdcY1+70, 'facade');
  addGlassZone(0, G.rdcY1+20, 8, G.rdcY1+60, 'facade');
  addGlassZone(G.houseX2-8, G.rdcY1+30, G.houseX2, G.rdcY1+70, 'facade');
  addGlassZone(G.houseX2-8, G.r1Y1+30, G.houseX2, G.r1Y1+80, 'facade');
  addGlassZone(G.houseX2-8, G.r1Y1+100, G.houseX2, G.r1Y1+150, 'facade');
  addGlassZone(G.verX1+2, G.verY1, G.verX2-2, G.verY1+70, 'veranda_glass');
  addGlassZone(G.verX2-10, G.verY1+70, G.verX2, G.verY2-10, 'veranda_glass');
  addGlassZone(240, G.r1Y1-8, 290, G.r1Y1, 'velux_r2');
  addGlassZone(100, 0, 170, 8, 'velux_r2_big');
  addGlassZone(540, 0, 620, 8, 'velux_r2_big');
  addGlassZone(0, G.basY1+30, 12, G.basY1+90, 'cave_door');
  addGlassZone(G.houseX2-12, G.basY1+30, G.houseX2, G.basY1+90, 'cave_door');

  buildWallGrid();
}

function addWall(x1,y1,x2,y2,type){
  walls.push({x1,y1,x2,y2,type});
}

function addWallSegmented(ax1,ay1,ax2,ay2,type,axis,gaps){
  const isVert = (ax1===ax2);
  let prev = isVert ? ay1 : ax1;
  const end = isVert ? ay2 : ax2;
  for(const [gs,ge] of gaps){
    if(prev < gs){
      if(isVert) addWall(ax1,prev,ax2,gs,type);
      else       addWall(prev,ay1,gs,ay2,type);
    }
    prev = ge;
  }
  if(prev < end){
    if(isVert) addWall(ax1,prev,ax2,end,type);
    else       addWall(prev,ay1,end,ay2,type);
  }
}

function addRadiator(x,y,w,h,zone){
  radiators.push({x,y,w,h,zone,cx:x+w/2,cy:y+h/2});
}

function addGlassZone(x1,y1,x2,y2,key){
  heatZones.push({x1,y1,x2,y2,type:'glass',key});
}

function buildWallGrid(){
  gridW = SIM_W / GRID_COLS;
  gridH = SIM_H / GRID_ROWS;
  wallGrid = new Array(GRID_COLS * GRID_ROWS).fill(null).map(()=>[]);
  for(let i=0;i<walls.length;i++){
    const w=walls[i];
    const minC=Math.max(0,Math.floor(Math.min(w.x1,w.x2)/gridW)-1);
    const maxC=Math.min(GRID_COLS-1,Math.ceil(Math.max(w.x1,w.x2)/gridW)+1);
    const minR=Math.max(0,Math.floor(Math.min(w.y1,w.y2)/gridH)-1);
    const maxR=Math.min(GRID_ROWS-1,Math.ceil(Math.max(w.y1,w.y2)/gridH)+1);
    for(let r=minR;r<=maxR;r++){
      for(let c=minC;c<=maxC;c++){
        wallGrid[r*GRID_COLS+c].push(i);
      }
    }
  }
}

function getWallsNear(x,y){
  const c=Math.min(GRID_COLS-1,Math.max(0,Math.floor(x/gridW)));
  const r=Math.min(GRID_ROWS-1,Math.max(0,Math.floor(y/gridH)));
  return wallGrid[r*GRID_COLS+c];
}

const MAX_P = 1600;
const px = new Float32Array(MAX_P);
const py = new Float32Array(MAX_P);
const pvx= new Float32Array(MAX_P);
const pvy= new Float32Array(MAX_P);
const pt = new Float32Array(MAX_P);
let N = 0;

const PARTICLE_R = 3.0;
const DRAG = 0.97;
const THERMAL_NOISE = 0.25;
const BUOY_FORCE = 0.04;
const HEAT_RADIUS = 30;
const HEAT_RATE = 0.012;
const COOL_RATE = 0.004;
const CONDUCT_RATE = 0.0008;
const DRAFT_FORCE = 0.6;

function spawnParticles(){
  N = 0;
  const regions = [
    ['bas_l',    5, G.basY1+5, 195, G.basY2-5, 120, 0.22],
    ['bas_c',  205, G.basY1+5, 495, G.basY2-5, 150, 0.22],
    ['bas_r',  505, G.basY1+5, 695, G.basY2-5, 120, 0.22],
    ['rdc_hall', 5, G.rdcY1+5, 195, G.rdcY2-5, 120, 0.35],
    ['rdc_kit', 210, G.rdcY1+5, 390, G.rdcY2-5, 130, 0.38],
    ['rdc_sal', 405, G.rdcY1+5, 695, G.rdcY2-5, 160, 0.38],
    ['ver',    G.verX1+5, G.verY1+5, G.verX2-5, G.verY2-5, 100, 0.30],
    ['r1_baby',  5, G.r1Y1+5, 225, G.r1Y2-5, 120, 0.38],
    ['r1_bath',235, G.r1Y1+5, 475, G.r1Y2-5, 120, 0.35],
    ['r1_par', 485, G.r1Y1+5, 695, G.r1Y2-5, 130, 0.38],
    ['r2_l',   190, G.r2Y1+5, 295, G.r1Y1-5, 80, 0.30],
    ['r2_c',   200, G.r2Y1+5, 510, G.r1Y1-5, 120, 0.28],
    ['r2_r',   385, G.r2Y1+5, 695, G.r1Y1-5, 90, 0.28],
  ];
  for(const [,x1,y1,x2,y2,cnt,temp] of regions){
    for(let i=0;i<cnt && N<MAX_P;i++){
      px[N] = x1 + Math.random()*(x2-x1);
      py[N] = y1 + Math.random()*(y2-y1);
      pvx[N]= (Math.random()-.5)*0.5;
      pvy[N]= (Math.random()-.5)*0.5;
      pt[N] = temp + (Math.random()-.5)*0.1;
      N++;
    }
  }
}

function segDistSq(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay;
  const lenSq=dx*dx+dy*dy;
  if(lenSq===0) return (px-ax)**2+(py-ay)**2;
  let t=((px-ax)*dx+(py-ay)*dy)/lenSq;
  t=Math.max(0,Math.min(1,t));
  const cx=ax+t*dx, cy=ay+t*dy;
  return (px-cx)**2+(py-cy)**2;
}

function reflectOffWall(i, wx1,wy1,wx2,wy2){
  const dx=wx2-wx1, dy=wy2-wy1;
  const len=Math.sqrt(dx*dx+dy*dy);
  if(len<.001) return;
  const nx=-dy/len, ny=dx/len;
  const dot=pvx[i]*nx+pvy[i]*ny;
  if(dot<0){
    pvx[i]-=2*dot*nx;
    pvy[i]-=2*dot*ny;
    pvx[i]*=0.6;
    pvy[i]*=0.6;
  }
  const px2=px[i], py2=py[i];
  const t2=((px2-wx1)*dx+(py2-wy1)*dy)/(dx*dx+dy*dy);
  const tc=Math.max(0,Math.min(1,t2));
  const cx=wx1+tc*dx, cy=wy1+tc*dy;
  const distX=px2-cx, distY=py2-cy;
  const dist=Math.sqrt(distX*distX+distY*distY);
  if(dist<PARTICLE_R && dist>0.001){
    const push=(PARTICLE_R-dist)/dist;
    px[i]+=distX*push;
    py[i]+=distY*push;
  }
}

function toCelsius(t){ return t*50; }
function fromCelsius(c){ return c/50; }

function tempColor(t){
  t = Math.max(0,Math.min(1,t));
  if(t<0.33){
    const f=t/0.33;
    return `rgb(${Math.round(68+f*(34-68))},${Math.round(f*197)},${Math.round(255+f*(94-255))})`;
  } else if(t<0.55){
    const f=(t-0.33)/0.22;
    return `rgb(${Math.round(34+f*(249-34))},${Math.round(197+f*(115-197))},${Math.round(94+f*(22-94))})`;
  } else {
    const f=(t-0.55)/0.45;
    return `rgb(${Math.round(249+f*(239-249))},${Math.round(115+f*(68-115))},${Math.round(22+f*(68-22))})`;
  }
}

const COLOR_LUT = new Array(256);
for(let i=0;i<256;i++) COLOR_LUT[i]=tempColor(i/255);

function colorIdx(t){ return Math.round(Math.max(0,Math.min(1,t))*255); }

let lastTime = 0;
let fps = 60;
let fpsTime = 0;
let fpsCount = 0;

function getDraftForce(x,y){
  let fx=0, fy=0;
  if(state.cave){
    if(y>G.basY1 && y<G.basY2 && x<300){ fx += DRAFT_FORCE * 0.3; }
    if(y>G.basY1 && y<G.basY2 && x>450){ fx += DRAFT_FORCE * 0.15; }
  }
  if(state.veranda){
    if(x>580 && x<760 && y>G.rdcY1 && y<G.rdcY2){
      fx += DRAFT_FORCE * 0.2 * (state.summer ? 1 : -0.3);
    }
  }
  if(state.velux){
    if(x>80 && x<200 && y<G.r1Y1+20 && y>G.r2Y1){ fy -= DRAFT_FORCE * 0.35; }
    if(x>530 && x<640 && y<G.r1Y1+20 && y>G.r2Y1){ fy -= DRAFT_FORCE * 0.35; }
  }
  if(state.facade){
    if(y>G.rdcY1 && y<G.rdcY2){ fx += DRAFT_FORCE * 0.25; }
    if(y>G.r1Y1 && y<G.r1Y2){ fx += DRAFT_FORCE * 0.25; }
  }
  return {fx,fy};
}

function applyHeatZone(i, hz){
  if(px[i]>=hz.x1-2 && px[i]<=hz.x2+2 && py[i]>=hz.y1-2 && py[i]<=hz.y2+2){
    if(hz.type==='ground'){
      pt[i] += (hz.temp - pt[i]) * hz.cond;
    } else if(hz.type==='glass'){
      let target, rate;
      if(hz.key==='veranda_glass'){
        target = state.summer ? 0.85 : fromCelsius(2);
        rate = state.summer ? 0.006 : 0.008;
      } else if(hz.key==='cave_door'){
        target = state.summer ? fromCelsius(20) : fromCelsius(5);
        rate = state.cave ? 0.01 : 0.003;
      } else if(hz.key.startsWith('velux_r2')){
        target = state.summer ? fromCelsius(35) : fromCelsius(3);
        rate = state.velux ? 0.012 : 0.004;
      } else {
        target = state.summer ? fromCelsius(28) : fromCelsius(2);
        rate = state.facade ? 0.015 : 0.005;
      }
      pt[i] += (target - pt[i]) * rate;
    }
  }
}

function step(dt){
  const steps = state.speed ? 3 : 1;
  for(let s=0;s<steps;s++) stepOnce(dt);
}

function stepOnce(dt){
  const extTempCold = fromCelsius(state.summer ? 28 : -2);
  const extTempHot  = fromCelsius(state.summer ? 38 : 5);
  const radTemp = state.heat ? 0.92 : 0.0;

  for(let i=0;i<N;i++){
    const buoy = (pt[i]-0.5)*BUOY_FORCE;
    pvy[i] -= buoy;
    pvx[i] += (Math.random()-.5)*THERMAL_NOISE;
    pvy[i] += (Math.random()-.5)*THERMAL_NOISE;
    const d = getDraftForce(px[i], py[i]);
    pvx[i] += d.fx * dt;
    pvy[i] += d.fy * dt;
    pvx[i] *= DRAG;
    pvy[i] *= DRAG;
    px[i] += pvx[i];
    py[i] += pvy[i];

    const isInVeranda = px[i]>G.verX1 && px[i]<G.verX2 && py[i]>G.verY1 && py[i]<G.verY2;
    if(!isInVeranda){
      if(px[i]<PARTICLE_R){ px[i]=PARTICLE_R; pvx[i]=Math.abs(pvx[i])*0.5; }
      if(px[i]>G.houseX2-PARTICLE_R){ px[i]=G.houseX2-PARTICLE_R; pvx[i]=-Math.abs(pvx[i])*0.5; }
    } else {
      if(px[i]<G.verX1+PARTICLE_R){ px[i]=G.verX1+PARTICLE_R; pvx[i]=Math.abs(pvx[i])*0.5; }
      if(px[i]>G.verX2-PARTICLE_R){ px[i]=G.verX2-PARTICLE_R; pvx[i]=-Math.abs(pvx[i])*0.5; }
    }
    if(py[i]<PARTICLE_R){ py[i]=PARTICLE_R; pvy[i]=Math.abs(pvy[i])*0.5; }
    if(py[i]>SIM_H-PARTICLE_R){ py[i]=SIM_H-PARTICLE_R; pvy[i]=-Math.abs(pvy[i])*0.5; }

    const nearWalls = getWallsNear(px[i], py[i]);
    for(const wi of nearWalls){
      const w=walls[wi];
      const d2=segDistSq(px[i],py[i],w.x1,w.y1,w.x2,w.y2);
      if(d2 < PARTICLE_R*PARTICLE_R){ reflectOffWall(i, w.x1,w.y1,w.x2,w.y2); }
    }

    if(state.heat){
      for(const rad of radiators){
        const rdx=px[i]-rad.cx, rdy=py[i]-rad.cy;
        const rd2=rdx*rdx+rdy*rdy;
        if(rd2 < HEAT_RADIUS*HEAT_RADIUS){
          const factor=1-(Math.sqrt(rd2)/HEAT_RADIUS);
          pt[i] += (radTemp-pt[i])*HEAT_RATE*factor;
          pvy[i] -= factor*0.15;
        }
      }
    }

    for(const hz of heatZones){ applyHeatZone(i, hz); }

    const nearOuter = (px[i]<10 || px[i]>G.houseX2-10 || py[i]<6);
    if(nearOuter){
      const target = state.summer ? extTempHot : extTempCold;
      pt[i] += (target-pt[i])*0.003;
    }
    pt[i] = Math.max(0, Math.min(1, pt[i]));
  }

  const checks = Math.min(N*2, 1200);
  for(let k=0;k<checks;k++){
    const a=(Math.random()*N)|0;
    const b=(Math.random()*N)|0;
    if(a===b) continue;
    const dx=px[a]-px[b], dy=py[a]-py[b];
    if(Math.abs(dx)>12||Math.abs(dy)>12) continue;
    const d2=dx*dx+dy*dy;
    if(d2<36){
      const diff=pt[a]-pt[b];
      pt[a]-=diff*CONDUCT_RATE;
      pt[b]+=diff*CONDUCT_RATE;
    }
  }
}

let heatmapCanvas = null;
let heatmapCtx = null;
const HMAP_W = 100, HMAP_H = 70;
const heatmapData = new Float32Array(HMAP_W*HMAP_H);
const heatmapCount= new Uint16Array(HMAP_W*HMAP_H);

function buildHeatmap(){
  heatmapData.fill(0);
  heatmapCount.fill(0);
  const scX=HMAP_W/SIM_W, scY=HMAP_H/SIM_H;
  for(let i=0;i<N;i++){
    const c=Math.min(HMAP_W-1,(px[i]*scX)|0);
    const r=Math.min(HMAP_H-1,(py[i]*scY)|0);
    const idx=r*HMAP_W+c;
    heatmapData[idx]+=pt[i];
    heatmapCount[idx]++;
  }
}

function renderHeatmap(cw,ch){
  if(!heatmapCanvas){
    heatmapCanvas=document.createElement('canvas');
    heatmapCanvas.width=HMAP_W;
    heatmapCanvas.height=HMAP_H;
    heatmapCtx=heatmapCanvas.getContext('2d');
  }
  buildHeatmap();
  const img=heatmapCtx.createImageData(HMAP_W,HMAP_H);
  const d=img.data;
  for(let i=0;i<HMAP_W*HMAP_H;i++){
    const t=heatmapCount[i]>0 ? heatmapData[i]/heatmapCount[i] : -1;
    let r=10,g=14,b=26;
    if(t>=0){
      const idx=colorIdx(t);
      const col=COLOR_LUT[idx];
      const m=col.match(/\d+/g);
      r=+m[0]; g=+m[1]; b=+m[2];
    }
    d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; d[i*4+3]=255;
  }
  heatmapCtx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(heatmapCanvas,0,0,cw,ch);
}

function drawScene(cw, ch){
  const sc=scale;
  const offX=(cw-SIM_W*sc)/2;
  const offY=(ch-SIM_H*sc)/2;

  ctx.save();
  ctx.translate(offX,offY);
  ctx.scale(sc,sc);

  ctx.globalAlpha=0.25;
  const roomFills=[
    [0, G.basY1, G.houseX2, G.basY2-G.basY1,'#1e1b4b'],
    [0, G.rdcY1, G.houseX2, G.rdcY2-G.rdcY1,'#1e293b'],
    [G.verX1,G.verY1,G.verX2-G.verX1,G.verY2-G.verY1,'#0d3f2b'],
    [0, G.r1Y1, G.houseX2, G.r1Y2-G.r1Y1,'#1e293b'],
    [0, G.r2Y1, G.houseX2, G.r1Y1-G.r2Y1,'#172032'],
  ];
  for(const [x,y,w,h,col] of roomFills){
    ctx.fillStyle=col; ctx.fillRect(x,y,w,h);
  }
  ctx.globalAlpha=1;

  ctx.globalAlpha=0.45;
  renderHeatmap(SIM_W, SIM_H);
  ctx.globalAlpha=1;

  ctx.save();
  const PR2 = PARTICLE_R*1.4;
  for(let i=0;i<N;i++){
    ctx.fillStyle=COLOR_LUT[colorIdx(pt[i])];
    ctx.beginPath();
    ctx.arc(px[i],py[i],PR2,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  for(const w of walls){
    ctx.beginPath();
    ctx.moveTo(w.x1,w.y1);
    ctx.lineTo(w.x2,w.y2);
    if(w.type==='glass'){
      ctx.strokeStyle='rgba(147,210,255,0.75)';
      ctx.lineWidth=2.5;
      ctx.setLineDash([4,3]);
    } else if(w.type==='ground'){
      ctx.strokeStyle='rgba(100,80,40,0.6)';
      ctx.lineWidth=4;
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle='rgba(180,190,210,0.85)';
      ctx.lineWidth=2;
      ctx.setLineDash([]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  for(const rad of radiators){
    ctx.fillStyle = state.heat ? 'rgba(255,120,30,0.85)' : 'rgba(80,80,100,0.5)';
    ctx.fillRect(rad.x,rad.y,rad.w,rad.h);
    if(state.heat){
      ctx.shadowColor='rgba(255,100,20,0.6)';
      ctx.shadowBlur=8;
      ctx.fillRect(rad.x,rad.y,rad.w,rad.h);
      ctx.shadowBlur=0;
    }
  }

  ctx.font='bold 10px Segoe UI,sans-serif';
  ctx.fillStyle='rgba(200,210,230,0.7)';
  ctx.textAlign='center';
  const labels=[
    [100,G.basY1+30,'BASEMENT/CAVE'],
    [100,G.rdcY1+30,'HALLWAY'],
    [300,G.rdcY1+30,'KITCHEN'],
    [560,G.rdcY1+30,'SALON'],
    [850,G.verY1+30,'VERANDA'],
    [115,G.r1Y1+30,'BABY ROOM'],
    [350,G.r1Y1+30,'BATHROOM'],
    [590,G.r1Y1+30,'PARENT ROOM'],
    [350,G.r2Y1+15,'ATTIC R+2'],
    [580,G.basY1+30,'ATELIER'],
  ];
  for(const [x,y,txt] of labels){
    ctx.fillText(txt,x,y);
  }

  ctx.font='12px Segoe UI';
  ctx.fillStyle=state.summer?'rgba(255,180,30,0.9)':'rgba(100,180,255,0.9)';
  ctx.fillText(state.summer?'☀ SUMMER':'❄ WINTER', SIM_W-55, 18);

  ctx.font='9px Segoe UI';
  ctx.fillStyle='rgba(100,255,150,0.85)';
  if(state.cave)     ctx.fillText('CAVE OPEN',12,G.basY1+15);
  if(state.veranda)  ctx.fillText('VER OPEN',G.verX1+5,G.verY2-5);
  if(state.velux)    ctx.fillText('VLX OPEN',140,G.r2Y1+12);
  if(state.facade)   ctx.fillText('WIN OPEN',G.houseX2-45,G.rdcY1+12);

  ctx.restore();
}

let sumT=0, minT=1, maxT=0;

function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTime)/1000, 0.05);
  lastTime=ts;

  fpsCount++;
  if(ts-fpsTime>500){
    fps=Math.round(fpsCount*1000/(ts-fpsTime));
    fpsCount=0; fpsTime=ts;
    document.getElementById('fps-counter').textContent=fps+' FPS';
  }

  step(dt);

  sumT=0; minT=1; maxT=0;
  for(let i=0;i<N;i++){
    const t=pt[i];
    sumT+=t;
    if(t<minT) minT=t;
    if(t>maxT) maxT=t;
  }
  if(N>0){
    document.getElementById('s-avg').textContent=(toCelsius(sumT/N)).toFixed(1);
    document.getElementById('s-min').textContent=(toCelsius(minT)).toFixed(1);
    document.getElementById('s-max').textContent=(toCelsius(maxT)).toFixed(1);
    document.getElementById('s-n').textContent=N;
  }

  const cw=canvas.width/(window.devicePixelRatio||1);
  const ch=canvas.height/(window.devicePixelRatio||1);
  ctx.save();
  ctx.fillStyle='#0a0e1a';
  ctx.fillRect(0,0,cw*2,ch*2);
  ctx.restore();

  drawScene(cw,ch);
}

function toggle(key){
  if(key==='heat'){
    state.heat=!state.heat;
    const b=document.getElementById('btn-heat');
    b.textContent=state.heat?'Radiators ON':'Radiators OFF';
    b.className='btn-toggle'+(state.heat?' active active-warm':'');
  } else if(key==='season'){
    state.summer=!state.summer;
    const b=document.getElementById('btn-season');
    b.textContent=state.summer?'Summer':'Winter';
    b.className='btn-toggle'+(state.summer?' active active-warm':'');
  } else if(key==='cave'){
    state.cave=!state.cave;
    const b=document.getElementById('btn-cave');
    b.className='btn-toggle'+(state.cave?' active active-open':'');
  } else if(key==='veranda'){
    state.veranda=!state.veranda;
    const b=document.getElementById('btn-veranda');
    b.className='btn-toggle'+(state.veranda?' active active-open':'');
  } else if(key==='velux'){
    state.velux=!state.velux;
    const b=document.getElementById('btn-velux');
    b.className='btn-toggle'+(state.velux?' active active-open':'');
  } else if(key==='facade'){
    state.facade=!state.facade;
    const b=document.getElementById('btn-facade');
    b.className='btn-toggle'+(state.facade?' active active-open':'');
  } else if(key==='speed'){
    state.speed=!state.speed;
    const b=document.getElementById('btn-speed');
    b.textContent=state.speed?'3x Speed':'1x Speed';
    b.className='btn-toggle'+(state.speed?' active':'');
  }
}

resize();
spawnParticles();
requestAnimationFrame(ts=>{lastTime=ts; requestAnimationFrame(loop);});
</script>
